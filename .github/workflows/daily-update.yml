name: Daily AGI Signal Update

on:
  schedule:
    - cron: '0 0 * * *'   # midnight UTC every day
  workflow_dispatch:       # also run manually from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # allows the bot to commit & push the updated JSON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python data/scraper.py --output-dir public/data

      - name: Commit and push updated data
        run: |
          git config user.name  "agi-tracker-bot"
          git config user.email "bot@github.local"
          git add public/data/latest_data.json public/data/historical_trends.json
          git diff --cached --quiet || git commit -m "data: daily signal update $(date -u +%Y-%m-%d)"
          git push
